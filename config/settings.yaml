# ============================================================
# 一夜持股法 - 策略配置文件
# 所有参数均可在此调整
# version: 1 = 旧版简单策略, 2 = 新版精细化策略
# ============================================================

# ========== 数据配置 ==========
data:
  request_interval: 1.0          # akshare API 请求间隔(秒)
  max_retries: 3                 # API 调用最大重试次数
  timeout: 30                    # API 超时时间(秒)

  cache:
    db_path: "./outputs/cache/market_data.db"
    calendar_path: "./outputs/cache/trading_calendar.json"
    daily_cache_days: 365        # 日线数据缓存天数
    minute_cache_days: 30        # 分钟线数据缓存天数

# ========== 策略参数 ==========
strategy:
  version: 2                     # 策略版本: 1=旧版, 2=新版

  # ---- V1 个股筛选条件 (version=1 时使用, version=2 时作为 fallback) ----
  filters:
    min_volume_ratio: 1.5
    min_tail_lift_pct: 1.0
    min_turnover_rate_pct: 3.0
    exclude_limit_up: true
    exclude_limit_down: true
    min_market_cap_billion: 2.0
    max_market_cap_billion: 500.0
    exclude_st: true
    min_price: 3.0

  # ---- V1 大盘/板块过滤 ----
  market:
    min_advance_decline_ratio: 1.0
    max_market_decline_pct: 2.0
    require_sector_up: true
    sector_top_n: 10

  # ---- V1 排序与仓位 ----
  ranking:
    weights:
      volume_ratio: 0.25
      tail_lift_magnitude: 0.25
      turnover_rate: 0.20
      sector_strength: 0.15
      market_cap_fit: 0.15
    max_positions: 5
    position_sizing: "equal"
    single_position_pct: 0.20

  # ========== V2 策略参数 (version=2 时使用) ==========
  v2:
    # --- Part 1: 选时与选股过滤 ---

    # Rule 1: 大盘环境 (一票否决)
    market_environment:
      index_codes: ["000001", "399006"]       # 上证指数, 创业板指
      require_above_ma5: true                  # 指数必须站稳5日线
      require_volume_above_ma5: true           # 预估日成交量不低于5日均量

    # Rule 2: 板块效应
    sector_effect:
      top_n: 20                                # 概念涨幅榜前20
      min_limit_up_in_sector: 2                # 板块内至少2只涨停
      exclude_ipo_one_line: true               # 排除新股一字板
      no_lone_wolves: true                     # 孤狼不碰，只做联动

    # Rule 3: 个股股性 (记忆周期)
    stock_character:
      memory_window_days: 10                   # 近10个交易日内
      require_recent_limit_up: true             # 有过涨停或炸板
      detect_failed_limit_up: true             # 检测炸板回落

    # Rule 4: 个股日内强度
    intraday_strength:
      gain_percentile_threshold: 0.85          # 涨幅在全市场前15%
      require_above_vwap: true                 # 全天在分时均线上方
      vwap_approximation: "typical"            # 回测中VWAP近似: typical | ohlc4

    # Rule 5: 市值与流动性
    market_cap_liquidity:
      min_market_cap_billion: 50               # 市值下限(亿)
      max_market_cap_billion: 200              # 市值上限(亿)
      min_turnover_rate_pct: 5.0               # 换手率下限(%)
      max_turnover_rate_pct: 10.0              # 换手率上限(%)
      min_volume_ratio: 1.0                    # 量比下限

    # --- Part 2: 尾盘进场信号 (14:30后, 3选2) ---
    entry_signals:
      require_any_n: 2                         # 至少满足的信号数
      # 回测模式下: 仅 Signal B 可用

      signal_a:                                # 大单吸筹
        enabled: true
        observation_start: "14:30"
        large_order_threshold_hands: 500       # 大单手数阈值
        require_net_inflow: true               # 要求特大单+大单净流入

      signal_b:                                # 尾盘突破
        enabled: true
        breakout_time_start: "14:40"
        morning_high_lookback_start: "09:30"
        volume_confirmation_multiplier: 1.2    # 突破量>前10根均量*倍率
        pattern_check: "rounded_flat"          # 圆角底或平底形态

      signal_c:                                # 抗抛压横盘
        enabled: true
        max_amplitude_pct: 1.0                 # 振幅<1%
        consolidation_start: "14:30"
        dip_volume_percentile: 20              # 下跌缩量<全天20%分位

    # --- Part 3: 次日离场纪律 ---
    exit:
      # Rule 9: 9:15-9:20 观察期
      auction_observation:
        enabled: true
        observation_start: "09:15"
        observation_end: "09:20"
        danger_patterns:
          - "limit_down_test_order"            # 跌停板试单
          - "high_open_then_cancel"            # 高开后撤单变绿

      # Rule 10: 9:25-9:35 分级执行
      graded_execution:
        flat_open_threshold: 0.5               # 平开/低开阈值(<0.5%)
        normal_high_low: 0.5                   # 正常高开下限(0.5%)
        normal_high_high: 3.0                  # 正常高开上限(3%)
        super_high_threshold: 3.0              # 超预期高开阈值(>3%)
        hold_to_time: "09:35"
        trailing_stop_to_open: true            # 创新高后止损上移至开盘价

      # Rule 11: 唯一格局条件
      hold_condition:
        require_first_to_limit_up: true         # 板块内第一只封死涨停
        order_book_ratio: 10                   # 封单额/当日成交额 > 10
        fallback_on_break: true                # 炸板前必须跟随卖出

    # --- V2 排序权重 ---
    ranking:
      weights:
        sector_strength: 0.20                  # 板块强度
        memory_cycle: 0.15                     # 记忆周期新鲜度
        intraday_strength: 0.20                # 日内强度 (VWAP+排名)
        volume_ratio: 0.15                     # 量比
        turnover_fit: 0.15                     # 换手率适配度 (5-10%区间最优)
        market_cap_fit: 0.10                   # 市值适配度 (50-200亿最优)
        entry_signal_count: 0.05               # 进场信号数量奖励
      max_positions: 3                         # 最大同时持仓 (从5收紧)
      position_sizing: "rank_weighted"         # 按排名加权分配
      single_position_pct: 0.25                # 单票最大仓位 (从0.20放宽)

# ========== 执行参数 ==========
execution:
  # ---- 回测参数 ----
  backtest:
    initial_capital: 100000.0
    start_date: "2023-01-01"
    end_date: "2025-12-31"
    commission_rate: 0.00025
    stamp_duty_rate: 0.001
    min_commission: 5.0
    slippage: 0.001
    backtest_confidence_penalty: 0.85          # V2回测置信度折扣(因部分信号降级)

  # ---- 实时运行参数 ----
  realtime:
    entry_time: "14:55"
    exit_time: "09:35"
    auction_start: "09:15"                     # V2新增: 竞价观察开始
    auction_end: "09:20"                       # V2新增: 竞价观察结束
    polling_intervals:
      pre_scan: 60
      entry_window: 30
      final_window: 10
      auction: 10                              # V2新增: 竞价观察间隔(秒)
    notify:
      enabled: true
      method: "console"
    dry_run: true

# ========== 风控参数 ==========
risk:
  max_daily_loss_pct: 3.0
  max_consecutive_losses: 3
  max_single_position_pct: 0.20
  position_lot_size: 100
  allow_chinext: true
  allow_star_market: false
  allow_bse: false
  min_position_value: 5000.0

# ========== 输出配置 ==========
output:
  log_dir: "./outputs/logs"
  report_dir: "./outputs/reports"
  log_level: "INFO"
  save_signals: true
  save_trades: true
  generate_charts: true
